services:
  mysql:
    image: mysql:8.4
    container_name: marau-reserve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marau_reserve
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: marau-reserve-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/marau_reserve?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: marau-reserve-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules
    # Bind mount substitui /app da imagem; instala deps no volume na primeira (ou após mudança de lockfile)
    command: sh -c "npm install && exec npm run dev -- --host 0.0.0.0 --port 5174"
    depends_on:
      - backend
    environment:
      # URL vista pelo navegador no host (porta publicada do backend)
      VITE_API_URL: http://localhost:8081
      CHOKIDAR_USEPOLLING: "true"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: marau-reserve-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: admin
      PMA_PASSWORD: admin
      UPLOAD_LIMIT: 64M
      PMA_ABSOLUTE_URI: http://localhost:8082/

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  default:
    name: marau-reserve-network
