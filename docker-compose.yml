services:

  mysql:
    image: mysql:8.4
    container_name: marau-reserve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marau_reserve
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: marau-reserve-backend
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/marau_reserve?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo"
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: marau-reserve-frontend
    ports:
      - "5174:5174"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:8081"
      CHOKIDAR_USEPOLLING: "true"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: marau-reserve-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
